<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%);
        color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
      }
      .container {
        background: #ffffff; padding: 40px 30px; border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 550px;
      }
      .header { text-align: center; margin-bottom: 25px; }
      h2 { color: #2c3e50; margin: 0; font-size: 24px; }
      p.subtitle { color: #666; margin-top: 5px; font-size: 14px; }
      fieldset { border: 1px solid #e0e0e0; border-radius: 8px; margin-top: 20px; padding: 10px 15px 15px; }
      legend { color: #2c3e50; font-weight: 700; padding: 0 8px; }
      label { display: block; margin-top: 15px; font-weight: 600; color: #444; }
      input, select {
        width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccd0d5; border-radius: 6px; box-sizing: border-box; font-size: 15px;
      }
      input:focus, select:focus { border-color: #3498db; outline: none; }
      .opcional { font-weight: normal; color: #888; font-size: 0.85em; font-style: italic; }
      button {
        width: 100%; margin-top: 30px; padding: 14px; background-color: #2c3e50; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold;
      }
      button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
      #status { display: none; text-align: center; margin-top: 15px; color: #2c3e50; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h2>Autorização de Evento</h2>
        <p class="subtitle">Selecione o evento e preencha os dados do participante</p>
      </div>

      <form id="formAutorizacao" onsubmit="enviarFormulario(event)">

        <label for="eventoSelecionado">Selecione o Evento:</label>
        <select id="eventoSelecionado" name="eventoSelecionado" required>
          <option value="">Carregando eventos...</option>
        </select>

        <fieldset>
          <legend>Dados do(a) Menor</legend>
          <label for="nomeJovem">Nome do(a) Menor <span class="opcional">(Opcional)</span>:</label>
          <input type="text" id="nomeJovem" name="nomeJovem" placeholder="Deixe em branco para preencher à mão">

          <label for="dataNascimento">Data de Nascimento <span class="opcional">(Opcional)</span>:</label>
          <input type="date" id="dataNascimento" name="dataNascimento">

          <label for="cpfMenor">CPF <span class="opcional">(Opcional)</span>:</label>
          <input type="text" id="cpfMenor" name="cpfMenor" placeholder="Deixe em branco para preencher à mão">

          <label for="rgMenor">RG <span class="opcional">(Opcional)</span>:</label>
          <input type="text" id="rgMenor" name="rgMenor" placeholder="Deixe em branco para preencher à mão">
        </fieldset>

        <fieldset>
          <legend>Dados do Responsável Legal</legend>
          <label for="nomeResponsavel">Nome do Responsável <span class="opcional">(Opcional)</span>:</label>
          <input type="text" id="nomeResponsavel" name="nomeResponsavel" placeholder="Deixe em branco para preencher à mão">

          <label for="cpfResponsavel">CPF <span class="opcional">(Opcional)</span>:</label>
          <input type="text" id="cpfResponsavel" name="cpfResponsavel" placeholder="Deixe em branco para preencher à mão">

          <label for="rgResponsavel">RG <span class="opcional">(Opcional)</span>:</label>
          <input type="text" id="rgResponsavel" name="rgResponsavel" placeholder="Deixe em branco para preencher à mão">
        </fieldset>

        <button type="submit" id="btnBaixar">Baixar PDF</button>
        <div id="status">Gerando documento, por favor aguarde...</div>
      </form>
    </div>

    <script>
      // Ao carregar a página, busca os eventos da planilha
      window.onload = function() {
        google.script.run
          .withSuccessHandler(preencherDropdown)
          .withFailureHandler(function(erro) {
            document.getElementById('eventoSelecionado').innerHTML = '<option value="">Erro ao carregar eventos</option>';
          })
          .getEventos();
      };

      function preencherDropdown(eventos) {
        const select = document.getElementById('eventoSelecionado');
        if (eventos.length === 0) {
          select.innerHTML = '<option value="">Nenhum evento cadastrado no momento</option>';
          return;
        }
        
        select.innerHTML = '<option value="">Selecione um evento...</option>';
        eventos.forEach(ev => {
          // Passamos o Nome e as Datas unidos por "|" para o servidor depois
          const valorParaServidor = ev.nome + "|" + ev.datasTexto;
          select.innerHTML += `<option value="${valorParaServidor}">${ev.nome} (${ev.datasTexto})</option>`;
        });
      }

      function enviarFormulario(event) {
        event.preventDefault();

        const form = document.getElementById('formAutorizacao');
        const btnBaixar = document.getElementById('btnBaixar');
        const status = document.getElementById('status');

        btnBaixar.disabled = true;
        btnBaixar.innerText = "Processando...";
        status.style.display = 'block';

        const dados = {
          eventoSelecionado: form.eventoSelecionado.value, // Ex: "Acampamento|12/10/2026, 13/10/2026 e 14/10/2026"
          nomeJovem: form.nomeJovem.value,
          dataNascimento: form.dataNascimento.value,
          cpfMenor: form.cpfMenor.value,
          rgMenor: form.rgMenor.value,
          nomeResponsavel: form.nomeResponsavel.value,
          cpfResponsavel: form.cpfResponsavel.value,
          rgResponsavel: form.rgResponsavel.value
        };

        google.script.run
          .withSuccessHandler(function(resposta) {
            const link = document.createElement('a');
            link.href = 'data:' + resposta.tipoMime + ';base64,' + resposta.dadosBase64;
            link.download = resposta.nomeArquivo;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            btnBaixar.disabled = false;
            btnBaixar.innerText = "Baixar PDF";
            status.style.display = 'none';
          })
          .withFailureHandler(function(erro) {
            alert('Erro ao gerar o PDF. Detalhes: ' + erro.message);
            btnBaixar.disabled = false;
            btnBaixar.innerText = "Baixar PDF";
            status.style.display = 'none';
          })
          .gerarPDF(dados);
      }
    </script>
  </body>
</html>
